<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <!-- Ilustración hero: veterinaria revisando a un perro -->
  <!-- Fondo -->
  <rect width="480" height="340" rx="24" fill="#dff2ff"/>
  <circle cx="60" cy="50" r="70" fill="#eafaf6" opacity="0.8"/>
  <circle cx="420" cy="300" r="90" fill="#d8f3ee" opacity="0.8"/>

  <!-- Mesa de consulta -->
  <rect x="120" y="230" width="240" height="18" rx="8" fill="#8a98a5"/>
  <rect x="150" y="248" width="18" height="70" fill="#5d7d95"/>
  <rect x="312" y="248" width="18" height="70" fill="#5d7d95"/>

  <!-- Perro sobre la mesa -->
  <ellipse cx="240" cy="198" rx="58" ry="34" fill="#caa06a"/>
  <circle cx="240" cy="150" r="34" fill="#caa06a"/>
  <ellipse cx="210" cy="146" rx="10" ry="20" fill="#b0894f" transform="rotate(18 210 146)"/>
  <ellipse cx="272" cy="146" rx="10" ry="20" fill="#b0894f" transform="rotate(-18 272 146)"/>
  <circle cx="228" cy="146" r="5" fill="#2c3e50"/>
  <circle cx="252" cy="146" r="5" fill="#2c3e50"/>
  <ellipse cx="240" cy="158" rx="16" ry="10" fill="#e3c795"/>
  <ellipse cx="240" cy="154" rx="5" ry="4" fill="#2c3e50"/>
  <path d="M272 214c16 8 26 8 40 0" fill="none" stroke="#caa06a" stroke-width="10" stroke-linecap="round"/>

  <!-- Veterinaria (revisando) -->
  <circle cx="150" cy="130" r="30" fill="#e8b98a"/>
  <path d="M120 126c0-24 16-36 28-36 16 0 30 14 30 34-8-8-16-10-30-10-12 0-20 4-28 12z" fill="#4a3b32"/>
  <circle cx="141" cy="128" r="4.5" fill="#2c3e50"/>
  <circle cx="159" cy="128" r="4.5" fill="#2c3e50"/>
  <path d="M146 140q4 4 8 0" fill="none" stroke="#a1674a" stroke-width="2"/>
  <path d="M96 196c-6 24-8 46-8 52h72V196c-12 10-24 14-36 14s-20-4-28-14z" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <path d="M128 156c-6 8-16 16-24 20" fill="none" stroke="#0e3b5a" stroke-width="5"/>
  <circle cx="128" cy="152" r="9" fill="#17a88f" stroke="#0e3b5a" stroke-width="4"/>
  <!-- Brazo hacia el perro -->
  <path d="M108 190c12 8 22 14 30 18" fill="none" stroke="#e8b98a" stroke-width="12" stroke-linecap="round"/>

  <!-- Texteo decorativo -->
  <circle cx="340" cy="120" r="34" fill="#ffffff" stroke="#17a88f" stroke-width="3"/>
  <path d="M337 112h6v6h6v6h-6v6h-6v-6h-6v-6h6z" fill="#17a88f"/>
  <text x="240" y="45" text-anchor="middle" font-family="Nunito, sans-serif" font-size="26" font-weight="800" fill="#0e3b5a">VetConnect</text>
</svg>